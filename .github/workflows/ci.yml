name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 训练/推理需要 CUDA + PyTorch/PyG/RDKit，这里只做不依赖它们的静态检查，
  # 目的是把语法错误、坏配置、误提交的运行产物挡在 main 之外。
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install lightweight tooling
        run: python -m pip install --upgrade pip pyyaml

      - name: Byte-compile all Python sources (syntax gate)
        run: python -m compileall -q models utils scripts preprocess

      - name: Parse YAML configs and environment file
        run: |
          python - <<'PY'
          import glob
          import yaml

          files = sorted(glob.glob('configs/**/*.y*ml', recursive=True)) + ['environment.yaml']
          for path in files:
              with open(path, encoding='utf-8') as handle:
                  doc = yaml.safe_load(handle)
              if not isinstance(doc, dict) or not doc:
                  raise SystemExit(f'{path}: expected a non-empty mapping')
              print(f'ok {path}')
          PY

      - name: Validate notebooks are well-formed JSON
        run: |
          python - <<'PY'
          import glob
          import json

          for path in sorted(glob.glob('notebooks/**/*.ipynb', recursive=True)):
              with open(path, encoding='utf-8') as handle:
                  nb = json.load(handle)
              assert 'cells' in nb, f'{path}: missing "cells"'
              errors = [
                  (i, o.get('ename'))
                  for i, c in enumerate(nb['cells'])
                  for o in c.get('outputs', [])
                  if o.get('output_type') == 'error'
              ]
              if errors:
                  raise SystemExit(f'{path}: stored error outputs {errors}')
              print(f'ok {path} ({len(nb["cells"])} cells)')
          PY

      - name: Keep runtime artefacts out of version control
        run: |
          bad=$(git ls-files \
            -- '*.pid' '*.out.tfevents.*' 'logs_diffusion_evaluation/*' \
            'logs_downstream_sweep_daemon/*' 'sweep_proc_logs/*' 'eval_covmat.json')
          if [ -n "$bad" ]; then
            echo "These runtime artefacts are tracked; run: git rm --cached <file>"
            echo "$bad"
            exit 1
          fi
          echo "ok: no runtime artefacts tracked"

  # 密钥一旦 commit 进历史就很难清干净（science-pop 就漏过一个 Coze PAT）。
  # 这里只匹配高置信度的前缀，不做熵分析，避免把 CI 变成误报噪音。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for committed credentials
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          PATTERNS = [
              ("GitHub token", re.compile(r"\b(ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{20,}\b")),
              ("GitHub fine-grained PAT", re.compile(r"\bgithub_pat_[0-9A-Za-z_]{30,}\b")),
              ("OpenAI-style key", re.compile(r"\bsk-[0-9A-Za-z_-]{20,}\b")),
              ("AWS access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("Slack token", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{10,}\b")),
              ("Google API key", re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b")),
              ("WeChat app secret", re.compile(
                  r"(?i)\b(wxappsecret|wx_app_secret|app_secret)\b\s*[:=]\s*['\"]?([0-9a-f]{32})['\"]?")),
              ("Coze PAT", re.compile(r"\bpat_[0-9A-Za-z]{20,}\b")),
          ]
          SKIP = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".pdf", ".zip", ".gz",
                  ".pkl", ".pt", ".pth", ".ckpt", ".onnx", ".bin", ".dll", ".so", ".pdb",
                  ".docx", ".hdr", ".ttf", ".woff", ".woff2", ".mp3", ".mp4", ".wav", ".h5",
                  ".safetensors", ".lock", ".whl", ".jar", ".class"}

          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                 text=True).stdout.split("\0")
          hits = []
          for name in filter(None, files):
              if name.endswith(tuple(SKIP)):
                  continue
              try:
                  blob = open(name, "rb").read(2 * 1024 * 1024)
              except OSError:
                  continue
              if b"\0" in blob:
                  continue
              text = blob.decode("utf-8", "replace")
              for label, pat in PATTERNS:
                  for m in pat.finditer(text):
                      hits.append(f"{label}: {name}: {m.group(0)[:24]}")
          if hits:
              print("\n".join(hits))
              sys.exit("发现疑似明文密钥（见上）；确认是误报就把该文件加进 SKIP 或换成占位符")
          print(f"ok  已扫描 {len([f for f in files if f])} 个文件，未发现明文密钥")
          PY
