data:
  name: PCQM4M
  path: /mnt2/luyifeng/diff4MoleculeRepresentation/data/PCQM4M
  train_ratio: 0.9
  val_ratio: 0.09
  max_mols: null
  node_in_dim: 9
  edge_in_dim: 3

encoder:
  spd_max_dist: 8

condition:
  source: none  # none | property | grale_official
  node_dim: 128
  graph_dim: 640
  adapter_hidden_dim: 512
  adapter_dropout: 0.1
  require_valid_mask: true
  valid_mask_source: grale  # grale keeps none/property/grale on the same official-GRALE-valid subset
  semantic_cache_dir: ${data.path}/pcqm4m-v2/semantic_v30_cache
  grale_cache_dir: ${data.path}/pcqm4m-v2/grale_official_cache
  compare_valid_cache_dir: ${condition.grale_cache_dir}
  normalize_grale: true
  apply_graph_dropout: true
  include_pcqm_y: true
  property_mean: 5.695413085946766
  property_std: 1.1695565030496946

model:
  model_mean_type: C0
  beta_schedule: linear
  beta_start: 5.e-5
  beta_end: 5.e-3
  num_diffusion_timesteps: 1000
  sample_time_method: symmetric
  sample_time_min_frac: 0.1
  sample_time_max_frac: 0.9
  sample_time_beta_alpha: 2.0
  time_emb_dim: 64
  time_emb_mode: sin
  center_pos_mode: graph
  node_indicator: true
  model_type: uni_o2_condition
  num_blocks: 1
  num_layers: 5
  hidden_dim: 128
  graph_emb_dim: 640
  n_heads: 16
  edge_feat_dim: 2
  num_r_gaussian: 20
  knn: 32
  num_node_types: 8
  act_fn: relu
  norm: true
  cutoff_mode: radius
  ew_net_type: r
  num_x2h: 1
  num_h2x: 1
  r_max: 5
  x2h_out_fc: false
  sync_twoup: false
  node_dropout: 0.0
  graph_dropout: 0.2

train:
  seed: 2025
  batch_size: 1024
  n_acc_batch: 2
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  max_iters: 28200
  lr: 0.0005
  weight_decay: 0.0
  grad_clip: 8.0
  report_iter: 50
  probe_freq: 250
  val_freq: 500
  save_freq: 1000
  validate_batches: 20
  amp: true
  amp_fallback_on_nan: true
  amp_fallback_steps: 100
  fixed_t: [100, 500, 900]
  log_bond_edge_attr_forced_none: true
  target_global_batch: 8192
