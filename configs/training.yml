data:
  name: PCQM4M # ZINC/PCQM4M
  path: ./data/PCQM4M
  # path: /mnt2/luyifeng/ZINC/zinc20_3d_6000000_k1/zinc_confs.lmdb
  node_in_dim: 9
  edge_in_dim: 3
  
encoder:
  hidden_dim: 176
  num_layers: 9
  num_heads: 8
  dropout: 0.1
  attn_dropout: 0.0
  edge_emb_dim: 64
  use_degree: True
  max_degree: 10
  use_spd_bias: False
  spd_max_dist: 8

model:
  model_mean_type: C0  # ['noise', 'C0']
  beta_schedule: linear
  beta_start: 5.e-5  # 1.e-7
  beta_end: 5.e-3        # 2.e-3
  num_diffusion_timesteps: 1000
  sample_time_method: symmetric  # ['importance', 'symmetric']

  time_emb_dim: 64
  graph_emb_dim: 176 # value of graph_emb_dim should be equal to encoder.hidden_dim
  time_emb_mode: sin
  center_pos_mode: graph

  node_indicator: True
  model_type: uni_o2_condition
  num_blocks: 1
  num_layers: 4
  hidden_dim: 128
  n_heads: 16
  edge_feat_dim: 5  # edge type feat
  num_r_gaussian: 20
  knn: 32 # !
  num_node_types: 8
  act_fn: relu

  norm: True
  cutoff_mode: radius
  ew_net_type: r  # [r, m, none]
  num_x2h: 1
  num_h2x: 1
  r_max: 1.5
  x2h_out_fc: False
  sync_twoup: False
  node_dropout: 0.1 # dropout node-wise embedding
  node_dropout_type: "node" # node/feature/both

train:
  seed: 0
  batch_size: 1024
  num_workers: 6
  n_acc_batch: 8
  max_iters: 15606
  val_freq: 390
  pos_noise_std: 0.1
  max_grad_norm: 8.0
  bond_loss_weight: 1.0
  optimizer:
    type: adam
    lr: 5.e-4
    weight_decay: 0
    beta1: 0.95
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 10
    min_lr: 1.e-6
